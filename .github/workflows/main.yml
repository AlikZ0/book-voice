name: Build BookVoice for iPhone

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Archive app without code signing
        run: |
          xcodebuild archive \
            -project BookVoice.xcodeproj \
            -scheme BookVoice \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/BookVoice.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_STYLE=Manual \
            SKIP_INSTALL=NO

      - name: Package unsigned IPA for sideloading
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/BookVoice.xcarchive/Products/Applications/BookVoice.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -q -r "$GITHUB_WORKSPACE/BookVoice-unsigned.ipa" Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BookVoice-unsigned-IPA
          path: BookVoice-unsigned.ipa
          retention-days: 14
